<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduHiPC ITW 2026 — Instructor Training Workshop — HiPeC Lab</title>
<meta name="description" content="EduHiPC Instructor Training Workshop (ITW) 2026 — page coming soon.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  :root {
    --void:     #08080d;
    --surface:  #10131c;
    --line:     #232a3c;
    --amber:    #f5a623;
    --white:    #edf0f5;
    --grey:     #7a8899;
    --sans:     'Inter', system-ui, sans-serif;
  }
  body {
    background: var(--void);
    color: var(--white);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    padding: 48px 36px;
  }
  .eyebrow {
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 14px;
  }
  h1 {
    font-size: 1.7rem;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.3;
  }
  p {
    color: var(--grey);
    font-size: 1rem;
    line-height: 1.6;
  }
  a {
    color: var(--amber);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  .back { display: inline-block; margin-top: 28px; font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">EduHiPC ITW 2026</div>
    <h1>Instructor Training Workshop</h1>
    <p>Page coming soon.</p>
    <a class="back" href="/">&larr; Back to HiPeC Lab</a>
  </div>
</body>
</html>
